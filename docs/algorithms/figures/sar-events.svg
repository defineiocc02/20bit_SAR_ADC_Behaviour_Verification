  <g id="text_41">
   <text style="font-size: 8.3px; font-family: 'Arial', 'Heiti SC'; text-anchor: start; fill: #485f6b" x="34.23685" y="41.849109" transform="rotate(-0 34.23685 41.849109)">生产顶层 RTL  ·  三种路径各 64 笔  ·  每行展示该路径首个 tag 的实际 RDAC 命令</text>
  </g>
  <g id="text_42">
   <text style="font-size: 7.3px; font-family: 'Arial', 'Heiti SC'; text-anchor: start; fill: #485f6b" x="34.23685" y="240.131721" transform="rotate(-0 34.23685 240.131721)">格内数字为实际写入码。拒绝路径的第 2 个事件抑制写入，第 3 个事件从 bit5 继续。</text>
  </g>
  <g id="text_43">
   <text style="font-size: 8.8px; font-family: 'Arial', 'Heiti SC'; text-anchor: start; fill: #006e68" x="34.23685" y="30.450148" transform="rotate(-0 34.23685 30.450148)">作用　只写已决位，防止试探扰动余差。</text>
  </g>
  <g id="text_44">
   <text style="font-size: 7.05px; font-family: 'Arial', 'Heiti SC'; text-anchor: start; fill: #006e68" x="34.23685" y="248.248333" transform="rotate(-0 34.23685 248.248333)">作者讲稿 p.9：RDAC 跟随 SADC。512 试探、拒绝沿和 bit5 回退是工程规则。</text>
  </g>
