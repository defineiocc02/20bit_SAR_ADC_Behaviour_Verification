  <g id="text_14">
   <text style="font-weight: 700; font-size: 15px; font-family: 'Arial', 'Heiti SC'; text-anchor: start; fill: #142f40" x="33.71811" y="16.805869" transform="rotate(-0 33.71811 16.805869)">同一个时钟沿可以同时采样、捕获和返回三笔数据</text>
  </g>
  <g id="text_15">
   <text style="font-size: 8.3px; font-family: 'Arial', 'Heiti SC'; text-anchor: start; fill: #485f6b" x="34.23685" y="47.454471" transform="rotate(-0 34.23685 47.454471)">生产顶层 RTL  ·  首三笔实际时钟沿  ·  640 MHz 理想时钟，宏按约定时刻应答</text>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 10px; font-family: 'Arial', 'Heiti SC'; text-anchor: start; fill: #a74529" x="391.648819" y="91.008" transform="rotate(-0 391.648819 91.008)">看第 32 沿</text>
  </g>
  <g id="text_17">
   <text style="font-size: 8.2px; font-family: 'Arial', 'Heiti SC'; text-anchor: start; fill: #142f40" x="391.648819" y="117.1728" transform="rotate(-0 391.648819 117.1728)">tag 1   返回细码</text>
  </g>
  <g id="text_18">
   <text style="font-size: 8.2px; font-family: 'Arial', 'Heiti SC'; text-anchor: start; fill: #142f40" x="391.648819" y="140.778" transform="rotate(-0 391.648819 140.778)">tag 2   捕获余差</text>
  </g>
  <g id="text_19">
   <text style="font-size: 8.2px; font-family: 'Arial', 'Heiti SC'; text-anchor: start; fill: #142f40" x="391.648819" y="164.3832" transform="rotate(-0 391.648819 164.3832)">tag 3   采集输入</text>
  </g>
  <g id="text_20">
   <text style="font-weight: 700; font-size: 8.8px; font-family: 'Arial', 'Heiti SC'; text-anchor: start; fill: #006e68" x="59.655118" y="237.474" transform="rotate(-0 59.655118 237.474)">全部 191 个相邻输出间隔均为 16 拍 × 1.5625 ns = 25 ns。</text>
  </g>
  <g id="text_21">
   <text style="font-size: 7.3px; font-family: 'Arial', 'Heiti SC'; text-anchor: start; fill: #485f6b" x="34.23685" y="271.203321" transform="rotate(-0 34.23685 271.203321)">粗蓝段从转换启动延伸至末次写入。符号为实测事件沿，宏建立与整核物理时序另行验收。</text>
  </g>
  <g id="text_22">
   <text style="font-size: 8.8px; font-family: 'Arial', 'Heiti SC'; text-anchor: start; fill: #006e68" x="34.23685" y="33.957086" transform="rotate(-0 34.23685 33.957086)">作用　交错采样并按标签配对，保持连续出码。</text>
  </g>
  <g id="text_23">
   <text style="font-size: 7.05px; font-family: 'Arial', 'Heiti SC'; text-anchor: start; fill: #006e68" x="34.23685" y="280.356595" transform="rotate(-0 34.23685 280.356595)">ISSCC 图 9.8.1–2 · US10516408B2 图 16。图中 tag、640 MHz 时钟与返回沿取自工程仿真。</text>
  </g>
 </g>
