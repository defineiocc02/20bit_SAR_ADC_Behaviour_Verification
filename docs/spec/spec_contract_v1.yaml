# ============================================================================
# SPEC v1.1 追加（2026-11-13）—— 论文/专利正文到位后的机制级冻结
# ============================================================================
spec_v1_1:
  input:
    vdiff_range_v: [-3.0, 3.0]
    vdiff_pp_v: 6.0
    vcm_in_v: {value: 1.5, source: "AD4080_datasheet_borrowed, not ISSCC disclosure"}
    lsb20_v: {value: 5.7220458984375e-6, source: COMPUTED}
  residue:
    nominal_range_v: [0.0, 0.375]          # 9b * 32 => 0.375 V
    adc2_window_v: [-0.0375, 0.4125]        # 两端各 37.5 mV 余量
    overload_rule: "flag + clip；不允许静默截断后仍算有效码"
  adc2:
    physical_bits: {value: 14, source: ENGINEERING_ASSUMPTION}
    published_bits: {value: null, source: NOT_DISCLOSED}
    note: "9+14=23 不能推出 3 bit 冗余或精度；位数预算与精度分开"
  cf_nominal_f: {value: 6.40625e-13, source: "PPT p33 C_DAC/32 with 20.5pF"}

  # --- S4 现在有明确的跨片编码规则（US10511316B2 Fig.14） ---
  s4_cross_slice_mapping:
    source: US10511316B2_FIG14
    rule:
      DS1: 0
      DS2: B7
      DS3: B6
      DS4: B6
      DS5: B5
      DS6: B5
      DS7: B5
      DS8: B5
    invariant: "sum_s S4[s] == 4*B5 + 2*B6 + B7"
    scope_note: "这是 Fig.14 的特定实施例；Fig.18-21 允许把低位映射到轮换 2C 列，
      因此 S4 的编码不是全专利唯一，必须按选定实施例固定"
    current_code_status: "未实现（S4 在 512 码中从未被选）"

  # --- Fig.18-21 两级 DEM 的闭合算式 ---
  dem_fig21:
    shuffler350: "输入 B4/B5/B6 + 固定零；输出 8 片的纵向二进制选择向量"
    vertical_invariant: "2*sum(y_s) == 8*B4 + 4*B5 + 2*B6  =>  sum(y) = 4B4+2B5+B6 <= 7"
    shuffler352: "主阵列信息 + 一个固定零占位列一起做列置换"
    reserved_column:
      exactly_one: true
      source_of_position: controller353
      mux_rule: "该列选 shuffler350 的结果；其余列选 shuffler352 的共享横向码"
    test_vector: {B4: 1, B5: 1, B6: 0, expected_vertical_weight: "12C = 6 x 2C"}
    not_proven: "随机序列种子、LFSR 多项式、逐周期状态表；只能证结构，不能证硅片逐位一致"

  # --- 三维 DEM（ISSCC 层级，与专利实施例不是同一层） ---
  dem_three_dimensional:
    dim1: "18 片中选 8 工作组 + 2 spare"
    dim2: "3b horizontal（round-robin，片内重分配）"
    dim3: "3b vertical（8 个活动片间改权重分配）"
    source: "ISSCC Fig.9.8.3 / PPT p29-31"
    forbidden_equivalence: "不能推定 3b x 3b 码本 = 专利 Fig.11 的 15x2C 实施例"

  dither_weight_rule:
    status: UNRESOLVED
    note: "PPT p31 出现 8,8,8,8 与 4,2,1、P=50%，但没有闭合概率分布与极性/边界规则；
      4:2:1/7 需依 US10505561B2 正文另行证明"
