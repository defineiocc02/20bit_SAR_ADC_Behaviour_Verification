<svg xmlns="http://www.w3.org/2000/svg" id="digital-events-state" width="960" height="582" viewBox="0 0 960 582" role="img" aria-labelledby="digital-events-state-title digital-events-state-desc">
<title id="digital-events-state-title">SAR 如何处理 512 门限</title>
<desc id="digital-events-state-desc">这是由已实现的活动位、完成位、guard 位与期望事件序号还原的逻辑状态图。首提交锁定 Flash，普通区走六个位；最高区试探 512，接受则只判三位，拒绝则沿原前缀进入普通六位且不写 RDAC。</desc>
<defs>
<marker id="digital-events-state-i" viewBox="0 0 9 8" refX="8.5" refY="4" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#1b3441"/></marker>
<marker id="digital-events-state-t" viewBox="0 0 9 8" refX="8.5" refY="4" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#006d6a"/></marker>
<marker id="digital-events-state-r" viewBox="0 0 9 8" refX="8.5" refY="4" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#994124"/></marker>
<marker id="digital-events-state-g" viewBox="0 0 9 8" refX="8.5" refY="4" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="9" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#425b66"/></marker>
</defs>
<rect width="960" height="518" fill="white"/>
<g font-family="Arial, PingFang SC, Noto Sans CJK SC, Microsoft YaHei, sans-serif" fill="#1b3441">
<text x="28" y="41" text-anchor="start" font-size="30" font-weight="650" fill="#1b3441">SAR 拒绝 512 试探后，从哪一位继续？</text>
<text x="29" y="68" text-anchor="start" font-size="17" font-weight="400" fill="#425b66">状态由 active、guard、done 与期望事件序号共同表示。箭头条件以有效事件为前提。</text>
<g id="digital-events-state-reset-start">
<circle cx="85" cy="96" r="4.5" fill="#1b3441"/>
<path d="M85 101 V127" fill="none" stroke="#1b3441" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#digital-events-state-i)"/>
<text x="100" y="110" text-anchor="start" font-size="16" font-weight="450" fill="#425b66">复位</text>
<rect x="28.0" y="127.0" width="114" height="68" rx="34.0" fill="#ffffff" stroke="#1b3441" stroke-width="1.8"/>
<text x="85" y="158" text-anchor="middle" font-size="22" font-weight="600" fill="#1b3441">空闲</text>
<text x="85" y="180" text-anchor="middle" font-size="16" font-weight="400" fill="#425b66">等 start</text>
<path d="M142 161 H226" fill="none" stroke="#1b3441" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#digital-events-state-i)"/>
<text x="184" y="147" text-anchor="middle" font-size="17" font-weight="450" fill="#425b66" font-family="Menlo, DejaVu Sans Mono, monospace">start</text>
<rect x="226.0" y="127.0" width="188" height="68" rx="34.0" fill="#ffffff" stroke="#1b3441" stroke-width="1.8"/>
<text x="320" y="158" text-anchor="middle" font-size="22" font-weight="600" fill="#1b3441">提交 Flash</text>
<text x="320" y="180" text-anchor="middle" font-size="16" font-weight="400" fill="#425b66">首事件 · 锁定码 F</text>
</g>
<g id="digital-events-state-ordinary">
<path d="M414 161 H509" fill="none" stroke="#1b3441" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#digital-events-state-i)"/>
<text x="462" y="145" text-anchor="middle" font-size="18" font-weight="550" fill="#1b3441">F &lt; 7</text>
<rect x="509.0" y="127.0" width="172" height="68" rx="34.0" fill="#ffffff" stroke="#1b3441" stroke-width="1.8"/>
<text x="595" y="158" text-anchor="middle" font-size="22" font-weight="600" fill="#1b3441">普通逐位</text>
<text x="595" y="180" text-anchor="middle" font-size="16" font-weight="400" fill="#425b66">序号 2–7 · bit5–0</text>
<path d="M681 161 H776" fill="none" stroke="#1b3441" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#digital-events-state-i)"/>
<text x="729" y="145" text-anchor="middle" font-size="17" font-weight="500" fill="#1b3441">bit0 提交</text>
<rect x="776.0" y="127.0" width="148" height="68" rx="34.0" fill="#eef6f5" stroke="#006d6a" stroke-width="1.8"/>
<text x="850" y="158" text-anchor="middle" font-size="22" font-weight="600" fill="#006d6a">完成</text>
<text x="850" y="180" text-anchor="middle" font-size="16" font-weight="400" fill="#425b66">保存最终 k</text>
</g>
<g id="digital-events-state-guard">
<path d="M320 195 V283" fill="none" stroke="#1b3441" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#digital-events-state-i)"/>
<text x="332" y="236" text-anchor="start" font-size="18" font-weight="550" fill="#1b3441">F = 7</text>
<rect x="230.0" y="283.0" width="180" height="68" rx="34.0" fill="#ffffff" stroke="#1b3441" stroke-width="1.8"/>
<text x="320" y="314" text-anchor="middle" font-size="22" font-weight="600" fill="#1b3441">试探 512</text>
<text x="320" y="336" text-anchor="middle" font-size="16" font-weight="400" fill="#425b66">序号 2 · 位号 9</text>
<path d="M410 317 H509" fill="none" stroke="#006d6a" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#digital-events-state-t)"/>
<text x="459" y="302" text-anchor="middle" font-size="18" font-weight="600" fill="#006d6a">接受</text>
<rect x="509.0" y="283.0" width="172" height="68" rx="34.0" fill="#ffffff" stroke="#1b3441" stroke-width="1.8"/>
<text x="595" y="314" text-anchor="middle" font-size="22" font-weight="600" fill="#1b3441">低三位</text>
<text x="595" y="336" text-anchor="middle" font-size="16" font-weight="400" fill="#425b66">序号 3–5 · bit2–0</text>
<path d="M681 317 H850 V195" fill="none" stroke="#006d6a" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#digital-events-state-t)"/>
<text x="757" y="301" text-anchor="middle" font-size="17" font-weight="500" fill="#006d6a">bit0 提交</text>
<path d="M373 283 V242 H595 V195" fill="none" stroke="#994124" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#digital-events-state-r)"/>
<text x="492" y="230" text-anchor="middle" font-size="17" font-weight="600" fill="#994124">拒绝，保持 448</text>
<text x="493" y="266" text-anchor="middle" font-size="16" font-weight="400" fill="#994124">关闭写门，序号仍为 2</text>
</g>
<g id="digital-events-state-exception-outputs">
<path d="M28 378 H932" fill="none" stroke="#d0dadb" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text x="28" y="406" text-anchor="start" font-size="18" font-weight="650" fill="#006d6a">写门</text>
<text x="98" y="406" text-anchor="start" font-size="17" font-weight="400" fill="#1b3441">普通路径写 7 次。接受 512 写 5 次。拒绝 512 多一次比较，仍只写 7 次。</text>
<text x="28" y="439" text-anchor="start" font-size="18" font-weight="650" fill="#994124">出错</text>
<text x="98" y="439" text-anchor="start" font-size="17" font-weight="400" fill="#1b3441">有效事件的 qid、序号、位号或命令范围非法时，err_o 锁存并关闭写门。</text>
<text x="28" y="473" text-anchor="start" font-size="18" font-weight="650" fill="#1b3441">优先级</text>
<text x="98" y="473" text-anchor="start" font-size="17" font-weight="400" fill="#1b3441">异步复位优先，其次 start 另起一笔并清错。叶子 abort 可结束本笔，顶层将它接 0。</text>
</g>
</g>
<rect x="0" y="518" width="960" height="36" fill="white"/><path d="M25 519H935" stroke="#c6d4d4"/><a href="https://github.com/defineiocc02/20bit_SAR_ADC_Behaviour_Verification/blob/3057d2f/references/ISSCC2024_SLIDES.pdf#page=9"><text x="25" y="542" font-family="Arial, PingFang SC, Heiti SC, sans-serif" font-size="15" fill="#285851">讲稿第 9 页：RDAC 跟随 SADC。512 试探、回退 bit5 及逐拍写门为工程状态机。</text></a>
<rect x="0" y="554" width="960" height="28" fill="white"/><text class="svg-purpose" x="25" y="573" font-size="16" font-weight="600" font-family="Arial, PingFang SC, Heiti SC, sans-serif" fill="#142f40">作用　拒绝保护试探时关写门，保留已决前缀。</text>
</svg>
