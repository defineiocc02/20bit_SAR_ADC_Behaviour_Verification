name: 20b10mtask SKY130HD physical

on:
  push:
    branches: [20b10mtask]
    paths:
      - 'task1/rtl/**'
      - 'task1/physical/sky130*.mk'
      - 'task1/physical/sky130*.sdc'
      - 'task1/physical/sky130*.sh'
      - 'task1/physical/sky130*.py'
      - 'task1/physical/package_proxy.py'
      - 'task1/physical/post_route.tcl'
      - '.github/workflows/task1_sky130.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task1-sky130-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sky130:
    if: github.ref_name == '20b10mtask'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RUN_DIR: /tmp/task1-sky130-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Route and stream out the SKY130HD design
        run: bash task1/physical/sky130_run.sh "$RUN_DIR"
      - name: Upload GDS, timing and run manifest
        uses: actions/upload-artifact@v4
        with:
          name: task1-sky130hd-physical-${{ github.run_id }}
          path: ${{ env.RUN_DIR }}/delivery
          if-no-files-found: error
      - name: Upload physical diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: task1-sky130hd-diagnostics-${{ github.run_id }}
          path: |
            ${{ env.RUN_DIR }}/flow.log
            ${{ env.RUN_DIR }}/flow/logs/
            ${{ env.RUN_DIR }}/flow/reports/
            ${{ env.RUN_DIR }}/flow/results/sky130hd/task1_module1/base/6_final.*
            ${{ env.RUN_DIR }}/delivery/
