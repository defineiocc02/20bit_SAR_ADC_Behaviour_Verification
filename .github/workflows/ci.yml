name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: "1"
  MPLBACKEND: Agg

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.6.9
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check --diff .

  type:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - run: mypy --config-file=pyproject.toml

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e .[dev]
      - name: Unit + integration + audit regressions (fast)
        run: pytest -m "not slow" -q --cov --cov-report=xml
      - name: Full acceptance sweep
        if: matrix.python-version == '3.12'
        # The sweep is the `run_all.py` acceptance driver, not a pytest marker:
        # there are no tests marked `slow`, so `pytest -m "slow"` would collect
        # nothing and pass without exercising a single experiment.
        run: adi-run-all --results-dir /tmp/sweep
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage
          path: coverage.xml

  reproducibility:
    name: Determinism (byte-identical rerun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .[dev]
      - name: Run regression twice and compare
        run: |
          # `--results-dir` is the flag the CLI actually defines; `--out` did not
          # exist, so this job used to fail with `unrecognized arguments` before
          # a single experiment ran.
          adi-run-all --results-dir /tmp/run1
          adi-run-all --results-dir /tmp/run2
          python - <<'PY'
          import sys
          a = open('/tmp/run1/results.json', 'rb').read()
          b = open('/tmp/run2/results.json', 'rb').read()
          if a != b:
              print('ERROR: results.json is not byte-identical across runs')
              sys.exit(1)
          print('OK: results.json byte-identical across runs')
          PY


  build:
    name: Build and installed wheel CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: pip install dist/*.whl
      - name: Verify wheel outside the checkout
        working-directory: /tmp
        run: |
          adi-run-all --help
          adi-make-report --help
          python - <<'PYCODE'
          from adi_model.cli import find_tools_dir
          from adi_model import Config, sine_input
          from adi_model.pipeline import run_pipeline
          tools = find_tools_dir()
          assert tools is not None and tools.name == '_tools', tools
          cfg = Config.paper_literal(dither_mode='off')
          words = run_pipeline(cfg, sine_input(1.0, 1e6), 128).to_codes()
          assert len(words.code) == 128
          assert not words.analog_overflow.any()
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
