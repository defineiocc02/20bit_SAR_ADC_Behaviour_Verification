# 设计说明   :
#   * 现行极性为 C9 的 k=c−U，合法域 c≥U；coverage 名称须与收据 coverage 的 key 一致，否则覆盖链会断。
#   * 本文件只描述约束/验证意图，不是验收结论；实际状态以运行日志与归档收据为准。
