# Fixed-point contract — single authoritative copy for Python and SystemVerilog.
#
# Source of truth for every value here:
#   docs/rtl/RTL_ARITHMETIC_CONTRACT.md §2 (frozen 2026-09-18)
#   src/adi_model/contracts/fixed_point.py  (FixedPointFormat defaults)
#   rtl_params.vh generated by tools/export_rtl_params.py
#
# If this file and the RTL disagree, the RTL is wrong — except that any change to
# these numbers must go through an ADR (ADR 0014), never a local edit.
schema: 1
name: rtl_arithmetic_frozen
source: docs/rtl/RTL_ARITHMETIC_CONTRACT.md

formats:
  weight:
    name: Q30
    frac_bits: 30
    total_bits: 48
    signed: false          # W is a non-negative effective C/Cf weight
    scale: 1073741824      # 2**30
  voltage:
    name: Q32
    frac_bits: 32
    total_bits: 64
    signed: true
    scale: 4294967296      # 2**32
  accumulator:
    total_bits: 96
    signed: true
    # Legal range is the HALF-OPEN interval [-2**95, +2**95).
    # +2**95 itself is out of range: `not (-limit <= x < limit)`.
    legal_min: -39614081257132168796771975168   # -2**95
    legal_max_exclusive: 39614081257132168796771975168  # +2**95
    overflow_is_sticky: true
    overflow_raises: true   # never wraps
  output:
    total_bits: 20
    encoding: offset_binary
    midrise: true
    count: 1048576          # 2**20

derived:
  weight_scale: 1073741824
  voltage_scale: 4294967296
  output_count: 1048576
  acc_limit: 39614081257132168796771975168

rounding:
  # The ONLY rounding in the runtime datapath.
  adc2_bin_center:
    rule: half_to_even
    implementation: shift_and_compare   # no divider
    definition: |
      n = (2*code + 1) * (adc2_max_q - adc2_min_q)      # signed
      q = floor(n / 2**k)                               # arithmetic shift right
      r = n - q * 2**k                                  # 0 <= r < 2**k
      result = q + (2*r > 2**k or (2*r == 2**k and (q & 1) == 1))
    k: adc2_bits + 1
    tie_examples_divisor_2: [-7, -5, -3, -1, 1, 3, 5, 7]   # -> [-4,-2,-2,0,0,2,2,4]
  # Everything after the bin center is floor, never truncate-toward-zero.
  division:
    rule: floor
    note: |
      RTL `/` truncates toward zero. A negative non-integer quotient must be
      corrected by subtracting 1. This is a known Python-vs-RTL seam.

reconstruction:
  # Contract §3.2-3.5. Same expression the RTL implements; the Python reference
  # below is written from this text, not transliterated from the SV.
  rails: "sum(W * s) over 8 active slices x 71 units"
  gain: "sum(W * a)"
  total: "sum(W)"
  num: "(F - O) * 2**30 - rails * 2**32 - total * I"
  shifted: "(num + gain * 2**32) * 2**20"
  word: "floor(shifted / (gain * 2**33))"
  hardware_decomposition: "word = floor( (shifted >>> 33) / gain )"
  saturation:
    low: "clip at 0"
    high: "clip at 2**20 - 1"
    note: only the negative side is clipped per recon_core header; verify per module

flags:
  acc_ovf: sticky until clr_ovf
  gain_err: "gain <= 0 is a structural error, not an overflow"
  adc2_ovf: reported separately, does not suppress dout
