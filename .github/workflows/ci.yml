# =============================================================================
# 文件名     : ci.yml
# 版本       : v1.0
# 功能       : 检查现行 v21 ADC、独立部件和 Python 模型。
# 设计说明   :
#   * 整核入口只使用 v21 生产清单。独立部件的结果限定在其接口。
#   * 源文件、输入、结果绑定于同一提交和运行目录。
#   * 工具失败不能被格式报告替代。来源保留未评估状态。
# 变更记录   :
#   - 整核入口收口至 v21，退役旧链回放。
#   - 2026-11-24: 补全 CAAZ 独立回归的 PYTHONPATH（追加 experiments 目录）。
#   - 2026-11-24: 新增双域 40 MSPS 转换核与外围硬件边界（CRC24/OTP/SRAM/LVDS PHY）
#                 的严格 Verilator Lint、sv2v/Yosys 综合结构检查与实时仿真回归。
# =============================================================================
name: CI

# 事件只选择何时验证。主分支、PR 和手动运行共用同一设计入口。
# 较新运行取消过时运行，避免把旧提交的结论误用于当前代码。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI 仅读取仓库，结果通过工件存档。
# 测试不向源目录写回证据或装配输入。
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 固定数值计算线程数以便同环境复跑。
# 使用运行和尝试编号隔开临时目录，不重用其它任务工件。
env:
  OPENBLAS_NUM_THREADS: "1"
  MPLBACKEND: Agg
  SAR_CI_RUN_ROOT: /tmp/sar-ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # 1. 现行整核及独立数字组件
  # 顶层展开检查的是当前源闭包和端口。
  # 权重测试的目标是现行装载、范围和换代合同，需要真实完成标志。
  # DSP 算法和 CAAZ 样本域各有单项测试，均不装入另一套 ADC。
  # 模拟器产物写入专用目录，失败时保留原始日志。
  rtl:
    name: Current v21 and digital component contracts
    runs-on: ubuntu-24.04
    # 冷缓存额外编译一次 Verilator，给原有数字回归留足时间。
    timeout-minutes: 45
    env:
      VERILATOR: verilator
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-verilator
      - name: Install Python test dependencies
        run: python -m pip install -e . "pytest>=7.4"
      - name: Elaborate the current v21 ADC
        # 只读 v21 生产编译清单。绝对路径允许工具从本次专用目录加载源码。
        # 检查顶层与物理端口能完整展开，生成日志供诊断，不把 lint 当作功能对拍。
        # 清单只接受仓库内 RTL 源文件。注释、空行不作为工具参数。
        # 缺少源清单或 elaboration 失败为硬错误，不使用已退休的列表回退。
        shell: bash
        run: |
          work="$SAR_CI_RUN_ROOT/v21"
          mkdir -p "$work"
          cd "$work"
          sources=()
          while IFS= read -r line; do
            case "$line" in
              ""|//*) continue ;;
              rtl/*.sv) sources+=("$GITHUB_WORKSPACE/$line") ;;
              *) printf 'Invalid v21 source-list entry: %s\n' "$line" >&2; exit 1 ;;
            esac
          done < "$GITHUB_WORKSPACE/rtl/filelists/files_adc_v21.f"
          test "${#sources[@]}" -gt 0
          verilator --lint-only --timing -Wall -Werror-LATCH -Werror-WIDTH \
            -Werror-PINMISSING -Werror-SELRANGE \
            --top-module adc_digital_ip_v21 "${sources[@]}" > elaborate.log 2>&1 \
            || { cat elaborate.log; exit 1; }
      - name: Verify current weight configuration lifecycle
        # 用现行权重模块的定向序列核查合法装载、失败边界和重配。
        # 测试台打印通过或失败标志后结束。进程返回 0 仍需检查 20 项实际通过。
        # 二进制和输出日志只在 v21-config 用例目录创建。
        # 编译参数筛掉非致命风格告警；接口缺失与非法选择仍为硬错误。
        shell: bash
        run: |
          work="$SAR_CI_RUN_ROOT/v21-config"
          mkdir -p "$work"
          cd "$work"
          verilator --binary --timing --assert -j 2 --timescale 1ns/1ps \
            --x-initial unique --x-assign unique --coverage \
            -Werror-PINMISSING -Werror-SELRANGE \
            --top-module tb_cfg_lifecycle --Mdir obj \
            "$GITHUB_WORKSPACE/rtl/sar_core/wsum_v21.sv" \
            "$GITHUB_WORKSPACE/tb/v21/tb_cfg_lifecycle.sv" \
            > compile.log 2>&1 || { cat compile.log; exit 1; }
          ./obj/Vtb_cfg_lifecycle | tee simulation.log
          grep -Fx 'RESULT: PASS (20 checks)' simulation.log
      - name: Check signed v21 reconstruction across sample tags
        # 用仓库的逐笔 oracle 比对 DUT 数据、标签、饱和与错误标志。
        # 相邻有效沿和夹空拍两条路径共用同一测试台，记录随本次工件保留。
        run: |
          python tools/run_open_rtl.py --ci-coverage --simulator verilator --tops tb_i4_recon tb_recon_stream \
            --out "$SAR_CI_RUN_ROOT/v21-recon"
      - name: Verify physical slice handover and on-chip dither at the production top
        # 量化器与余差驱动读取生产 DUT 输出的开关。断开低段的反例须在 ADC2 接口可见。
        run: |
          python tools/run_open_rtl.py --ci-coverage --simulator verilator --tops tb_analog_if v21_sample_cadence \
            --out "$SAR_CI_RUN_ROOT/v21-top"
      - name: Compare installed default Python and production RTL transactions
        # 同一固定输入通过实际控制台入口，使用真实 RTL 采集的片号、两端开关、
        # 逐事件写门、原码和最终出码。强制字与权重失配另按其实际外部输入重放。
        run: |
          adi-simulate --dc -0.6522216796875 --samples 1024 --output "$SAR_CI_RUN_ROOT/python-default" > /dev/null
          python tools/check_default_rtl.py "$SAR_CI_RUN_ROOT/v21-top/v21_sample_cadence/samples.csv" \
            --default-npz "$SAR_CI_RUN_ROOT/python-default/codes.npz" > "$SAR_CI_RUN_ROOT/python-rtl-comparison.txt"
          cat "$SAR_CI_RUN_ROOT/python-rtl-comparison.txt"
      - name: Independent integer arithmetic with explicit format
        run: |
          python tools/audit_rtl_arithmetic.py \
            --format-json flow/sim/fixtures/math_only/format.json \
            --negative-controls --out "$SAR_CI_RUN_ROOT/arithmetic"
      - name: Selected DSP protocol and numerical kernels
        run: |
          python tools/run_open_rtl.py --ci-coverage --simulator verilator \
            --tops result_fifo_tb spi_slave_tb cnv_ctrl_contract_tb \
              sys_error_corr_contract_tb sinc5_decim_tb \
            --out "$SAR_CI_RUN_ROOT/dsp-leaf"
      - name: Standalone CAAZ behavior contracts
        # [CAAZ隔离] 独立模型保留偶奇配对检查；主核基础绑定位不声明模拟自归零。
        # [路径约定] flow 提供 tests.conftest 夹具，experiments 提供 extensions.caaz 模块根；
        #            2026-11 迁入 experiments/ 后若漏掉 experiments，pytest 采集会报 ModuleNotFoundError。
        #            该 PYTHONPATH 仅作用于本步骤，避免主核反向依赖实验扩展。
        env:
          PYTHONPATH: src:flow:experiments
        run: python -m pytest experiments/extensions/caaz/tests -q
      - name: Verify dual-domain 40 MSPS conversion core (40 MHz + self-timed follower)
        # [真实40MHz吞吐] 驱动真实 25 ns 帧时钟（50% 占空比）与 [0.2..6.2 ns] 自定时事件突发，
        # 校验连续 192 笔 40.000 MSPS 出码、64 字去扰、单单元校准、RA 安静窗零翻转与双项负对照。
        shell: bash
        run: |
          work="$SAR_CI_RUN_ROOT/v21-dualrate"
          mkdir -p "$work"
          cd "$work"
          # 按生产文件清单展开双域 40 MSPS 转换核全部源码，避免硬编码路径漂移
          sources=()
          while IFS= read -r line; do
            case "$line" in
              ""|//*) continue ;;
              rtl/*.sv) sources+=("$GITHUB_WORKSPACE/$line") ;;
            esac
          done < "$GITHUB_WORKSPACE/rtl/filelists/files_adc_v21_40msps.f"
          # 开启 Verilator --timing 与显式端口/越界错误门禁，跑满实测波形闭环
          verilator --binary --timing --assert -j 2 --timescale 1ns/1ps \
            -Werror-PINMISSING -Werror-SELRANGE \
            --top-module tb_40msps_dualrate --Mdir obj \
            "${sources[@]}" "$GITHUB_WORKSPACE/tb/v21/tb_40msps_dualrate.sv" \
            > compile.log 2>&1 || { cat compile.log; exit 1; }
          ./obj/Vtb_40msps_dualrate | tee simulation.log
          grep -q 'DUALRATE_40MSPS_PASS' simulation.log
      - name: Verify AD4080 silicon peripheral boundary wrappers (CRC24 / OTP / SRAM / LVDS PHY)
        # [流片硬件边界] 实跑可编程 CRC24（5 组 crc24.py 黄金向量 + 撤销/代际反例）、
        # OTP 宏+真实 otp_shadow_loader（含 ROM_CRC_ERR 与读错注入）、4×4096×20 SRAM 及 LVDS PHY。
        shell: bash
        run: |
          work="$SAR_CI_RUN_ROOT/periph-closure"
          mkdir -p "$work"
          cd "$work"
          # 直接联动冻结包内生产 otp_shadow_loader.sv，验证零改动接口兼容
          verilator --binary --timing --assert -j 2 --timescale 1ns/1ps \
            -Werror-PINMISSING -Werror-SELRANGE \
            --top-module tb_ad4080_silicon_periph_closure --Mdir obj \
            "$GITHUB_WORKSPACE/rtl/ad4080_periph/otp/otp_shadow_loader.sv" \
            "$GITHUB_WORKSPACE/rtl/top/ad4080_crc24_service.sv" \
            "$GITHUB_WORKSPACE/rtl/top/ad4080_otp_macro_adapter.sv" \
            "$GITHUB_WORKSPACE/rtl/top/ad4080_sram_bank_foundry_wrap.sv" \
            "$GITHUB_WORKSPACE/rtl/top/ad4080_result_store_foundry.sv" \
            "$GITHUB_WORKSPACE/rtl/top/ad4080_lvds_phy_wrapper.sv" \
            "$GITHUB_WORKSPACE/tb/v21/tb_ad4080_silicon_periph_closure.sv" \
            > compile.log 2>&1 || { cat compile.log; exit 1; }
          ./obj/Vtb_ad4080_silicon_periph_closure | tee simulation.log
          grep -q 'AD4080_SILICON_PERIPH_CLOSURE_PASS' simulation.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-component-evidence
          path: ${{ env.SAR_CI_RUN_ROOT }}

  # 2. 真正生产清单的独立结构检查与变异
  rtl-quality:
    name: Strict RTL lint, synthesis and four-state regression
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-verilator
      - name: Install isolated open RTL tools
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends yosys iverilog
          python -m pip install yowasp-yosys==0.71.0.0.post1285
          mkdir -p "$SAR_CI_RUN_ROOT/tools"
          cd "$SAR_CI_RUN_ROOT/tools"
          curl --fail --location --retry 4 --output sv2v.zip \
            https://github.com/zachjs/sv2v/releases/download/v0.0.13/sv2v-Linux.zip
          printf '%s  sv2v.zip\n' 552799a1d76cd177b9b4cc63a3e77823a3d2a6eb4ec006569288abeff28e1ff8 | sha256sum -c
          python -m zipfile -e sv2v.zip unpacked
          install -m 755 "$(find unpacked -name sv2v -type f -print -quit)" sv2v
          printf '%s\n' "$PWD" >> "$GITHUB_PATH"
          # 归纳和 PDR 使用与 Ubuntu Yosys 0.33 耦合的 SBY 源。
          curl --fail --location --retry 4 --output sby.tar.gz \
            https://codeload.github.com/YosysHQ/sby/tar.gz/1e1687d60ee56d2218bacf62856ef414ef67e5af
          printf '%s  sby.tar.gz\n' 0b7b498a9d960aa33533300e5bcdce42d77b13b3d6473f172ae23c8dce73d1f9 | sha256sum -c
          tar -xzf sby.tar.gz
          make -C sby-1e1687d60ee56d2218bacf62856ef414ef67e5af install PREFIX="$PWD/sby-install"
          printf '%s\n' "$PWD/sby-install/bin" >> "$GITHUB_PATH"
      - name: Gate actual core, DSP and peripheral hierarchies
        shell: bash
        run: YOSYS=yowasp-yosys make lint RUN_ROOT="$SAR_CI_RUN_ROOT"
      - name: Exercise the single-chip SAR to DSP handoff
        run: make sim-top RUN_ROOT="$SAR_CI_RUN_ROOT"
      - name: Run independent four-state checks and both core mutations
        shell: bash
        run: |
          bash tools/check_rtl_mutation.sh --core-only "$SAR_CI_RUN_ROOT/mutations"
          python tools/check_peripheral_counterexamples.py --out "$SAR_CI_RUN_ROOT/four-state"
      - name: Prove DEM guard saturation and the schedule invariants
        shell: bash
        run: bash tools/prove_core_safety.sh "$SAR_CI_RUN_ROOT/safety"
      - name: Lint and synthesize dual-domain 40 MSPS core and silicon boundary wrappers
        # [结构零锁存门禁] 对双域 40 MSPS 顶层及 4 项外围硬件边界模块分别运行严格
        # Verilator -Wall Lint 与 sv2v + yowasp-yosys 通用展开，确认 0 警告、0 锁存器。
        # [不改动冻结包] 新模块均位于 rtl/sar_core/ 与 rtl/top/，避免破坏 218 文件 SHA-256。
        shell: bash
        run: |
          work="$SAR_CI_RUN_ROOT/silicon-closure"
          mkdir -p "$work"
          # 逐顶层执行静态代码规则、Verilator -Wall 及 Yosys 零锁存展开
          python - <<'PY'
          import subprocess
          from pathlib import Path
          import os
          root = Path(os.environ["GITHUB_WORKSPACE"])
          work = Path(os.environ["SAR_CI_RUN_ROOT"]) / "silicon-closure"
          def read_fl(rel):
              return [str(root / l.strip()) for l in (root / rel).read_text().splitlines()
                      if l.strip() and not l.lstrip().startswith("//")]
          cases = [
              ("adc_digital_ip_v21_40msps", read_fl("rtl/filelists/files_adc_v21_40msps.f")),
              ("ad4080_crc24_service", [str(root / "rtl/top/ad4080_crc24_service.sv")]),
              ("ad4080_otp_macro_adapter", [str(root / "rtl/top/ad4080_otp_macro_adapter.sv")]),
              ("ad4080_result_store_foundry", [
                  str(root / "rtl/top/ad4080_sram_bank_foundry_wrap.sv"),
                  str(root / "rtl/top/ad4080_result_store_foundry.sv"),
              ]),
              ("ad4080_lvds_phy_wrapper", [str(root / "rtl/top/ad4080_lvds_phy_wrapper.sv")]),
          ]
          # 复用生产 RTL 源码文本规则检查，拒绝四态比较与混用复位风格
          import sys
          sys.path.insert(0, str(root / "tools"))
          import verify_rtl_quality as vrq
          all_srcs = [Path(s) for _, srcs in cases for s in srcs]
          vrq.check_code(all_srcs)
          for top, srcs in cases:
              d = work / top
              d.mkdir(parents=True, exist_ok=True)
              subprocess.run(
                  ["verilator", "--lint-only", "-Wall", "-Werror-LATCH", "-Werror-WIDTH",
                   "-Werror-PINMISSING", "-Werror-SELRANGE", "--top-module", top, *srcs],
                  check=True, cwd=d,
              )
              with (d / "net.v").open("w") as out:
                  subprocess.run(["sv2v", "-D", "SYNTHESIS", *srcs], check=True, cwd=d, stdout=out)
              script = (f"read_verilog -sv net.v; hierarchy -check -top {top}; proc; opt; "
                        "check -assert; select -assert-none t:$dlatch t:$adlatch")
              subprocess.run(["yowasp-yosys", "-Q", "-T", "-p", script], check=True, cwd=d)
              print(f"SILICON_CLOSURE_GATE PASS top={top} warnings=0 latches=0")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-rtl-quality
          path: |
            ${{ env.SAR_CI_RUN_ROOT }}/strict
            ${{ env.SAR_CI_RUN_ROOT }}/chip
            ${{ env.SAR_CI_RUN_ROOT }}/mutations
            ${{ env.SAR_CI_RUN_ROOT }}/four-state
            ${{ env.SAR_CI_RUN_ROOT }}/safety
            ${{ env.SAR_CI_RUN_ROOT }}/silicon-closure

  # 3. 语法门禁与全量风格报告
  # 在同一文件范围检查解析和名称。
  # 风格报告仍可供逐步治理。不把工具调用异常当成已生成有效报告。
  lint:
    name: Lint correctness and style report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.6.9
      - name: Gate Python syntax and invalid name references
        # 语法、编译和未定义名称继续全仓阻塞。
        # 使用和完整报告相同的 Ruff 版本及项目配置，所检查目录一致。
        run: ruff check --select E9,F63,F7,F82 --output-format=github .
      - name: Report full lint and formatting
        # 全量风格问题留作报告。调用异常或配置无效仍阻塞。
        # 保存原始输出便于逐条定位，同时避免在每个 PR 生成数百条风格注解。
        if: always()
        run: |
          mkdir -p "$SAR_CI_RUN_ROOT/lint"
          set +e
          ruff check . > "$SAR_CI_RUN_ROOT/lint/ruff.txt" 2>&1
          lint_status=$?
          ruff format --check . > "$SAR_CI_RUN_ROOT/lint/format.txt" 2>&1
          format_status=$?
          set -e
          printf 'Ruff report exit status: lint=%s, format=%s\n' "$lint_status" "$format_status" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          test "$lint_status" -le 1 && test "$format_status" -le 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-style-report
          path: ${{ env.SAR_CI_RUN_ROOT }}/lint
          if-no-files-found: ignore

  # 3. 类型路径
  # 固定 mypy 版本以减少依赖升级引起的类型结果漂移。
  # 当前解释器是否能加载并运行则由模型回归验证。
  type:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 固定已核验的 mypy 版本。真实 Python 运行兼容性由测试矩阵验证。
      - run: python -m pip install -e ".[dev]" "mypy==2.4.1"
      - run: mypy --config-file=pyproject.toml

  # 4. 来源身份与未实现义务
  # 来源登记有效不表示已运行 RTL。
  # 未完成义务单列，错误状态阻塞，缺原件的开放项继续呈现。
  source_index:
    name: Source references and unresolved obligations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Check working-tree contracts and published figures
        # 对照当前合同、Python、RTL 和图件，避免目录迁移留下坏链接或旧规格。
        # 算法图的检查仅读取图源、RTL 与已发布 SVG，无需浏览器或 EDA。
        run: |
          make audit
      - name: Check index structure without relabeling unbuilt mechanisms
        # [退出码约定] inventory_gate 返回 0 表示全就绪，返回 2 表示静态引用全通但仍有
        # 未实现/未运行义务；任何真正 FAIL 记录仍由下方断言阻塞。
        run: |
          mkdir -p "$SAR_CI_RUN_ROOT"
          set +e
          python -m adi_model.inventory_gate \
            --repo-root . --summary "$SAR_CI_RUN_ROOT/source-index.json"
          source_index_status=$?
          set -e
          python - "$source_index_status" "$SAR_CI_RUN_ROOT/source-index.json" <<'PY'
          import json
          import sys
          status = int(sys.argv[1])
          with open(sys.argv[2], encoding="utf-8") as handle:
              summary = json.load(handle)
          assert status in (0, 2), (status, summary)
          assert summary["static_refs_pass"], summary
          assert summary["source_conformance"] == "SOURCE_CONFORMANCE_NOT_ASSESSED"
          failures = [record for record in summary["records"]
                      if record["scope"] == "REGISTERED_REQUIRED_STATE"
                      and record["level"] == "FAIL"]
          assert not failures, failures
          print("Static references valid; source conformance remains NOT_ASSESSED.")
          unresolved = summary["unresolved_required_states"]
          print("Required-state completion:", summary["required_states_ready"])
          for record in unresolved:
              print(f"UNRESOLVED {record['level']} {record['check']}: {record['detail']}")
          for record in summary["records"]:
              if record["scope"] == "STATIC_IDENTITY_AND_REFERENCE" and record["level"] == "BLOCKED":
                  print(f"SOURCE_UNAVAILABLE {record['check']}: {record['detail']}")
          print("Static input completeness:", summary["static_inputs_complete"])
          if status == 2:
              print("Exit2 preserved as unresolved states above; this job is not an implementation PASS.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-index-states
          path: ${{ env.SAR_CI_RUN_ROOT }}/source-index.json

  # 5. 同一 Python 模型的兼容性
  # 解释器矩阵不切换 ADC 规格。
  # 完整历史用于读取有身份的旧证据，不将其用作默认模型。
  # 从模块入口启动 pytest，保留仓根实验配置和当前测试的导入关系。
  test:
    name: Model contracts (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e .[dev]
      - name: Current unit and integration contracts
        # 通过模块启动 pytest，仓根参与导入。工具脚本会读取 subsys 的实验配置。
        # 外部工具慢测与 Python 兼容性分开，当前数字组件在 RTL job 检查。
        run: python -m pytest flow/tests -m "not slow" -q --cov --cov-report=xml
      - name: Actual default and explicit-override CLI runs
        # [正反例校验] default 验默认零噪底交易参考；explicit 故意注入 3.5 V 超满量程幅度，
        # 验证模拟越界标志 analog_overflow 如实置位且不被静默过滤。
        run: |
          mkdir -p "$SAR_CI_RUN_ROOT"
          adi-simulate --samples 64 --output "$SAR_CI_RUN_ROOT/default"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["SAR_CI_RUN_ROOT"])
          (root / "parameters.json").write_text(json.dumps({
              "unit_mismatch_std": 0.0, "bridge_mismatch_std": 0.0,
              "ra_noise_rms_v": 0.0008,
          }), encoding="utf-8")
          PY
          adi-simulate --samples 32 --parameters "$SAR_CI_RUN_ROOT/parameters.json" \
            --amplitude 3.5 --output "$SAR_CI_RUN_ROOT/explicit"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import numpy as np
          root = Path(os.environ["SAR_CI_RUN_ROOT"])
          for name, count in (("default", 64), ("explicit", 32)):
              with (root / name / "metadata.json").open(encoding="utf-8") as handle:
                  metadata = json.load(handle)
              assert metadata["model_run"] is True
              assert metadata["result_role"] == "DIGITAL_IP_TRANSACTION_REFERENCE"
              assert metadata["source_reproduction"] is False
              assert metadata["source_conformance"] == "NOT_ASSESSED"
              assert metadata["records_filtered"] == 0
              assert metadata["inferences"] and metadata["unmodeled"]
              with np.load(root / name / "codes.npz", allow_pickle=False) as data:
                  assert all(len(data[key]) == count for key in data.files)
                  if name == "explicit":
                      assert data["analog_overflow"].any()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-contracts-py${{ matrix.python-version }}
          path: |
            coverage.xml
            ${{ env.SAR_CI_RUN_ROOT }}

  # 6. 可复现记录
  # 分别落盘两次独立运行，逐数组比较，不只比较摘要数字。
  # 同时检验元数据和标志，防止静默过滤异常记录后仍宣称一致。
  reproducibility:
    name: Seeded records and flags reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run the actual model twice and compare records
        run: |
          mkdir -p "$SAR_CI_RUN_ROOT"
          adi-simulate --samples 128 --seed 20261105 --output "$SAR_CI_RUN_ROOT/run1"
          adi-simulate --samples 128 --seed 20261105 --output "$SAR_CI_RUN_ROOT/run2"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import numpy as np
          root = Path(os.environ["SAR_CI_RUN_ROOT"])
          with np.load(root / "run1/codes.npz", allow_pickle=False) as left, np.load(
              root / "run2/codes.npz", allow_pickle=False
          ) as right:
              assert left.files == right.files
              for key in left.files:
                  assert np.array_equal(left[key], right[key]), key
          left = json.loads((root / "run1/metadata.json").read_text(encoding="utf-8"))
          right = json.loads((root / "run2/metadata.json").read_text(encoding="utf-8"))
          assert left == right
          assert left["source_reproduction"] is False
          print("Seeded records, flags and assumption metadata match within this environment.")
          PY

  # 7. 发布包自检
  # wheel 需要在没有检出目录的环境中运行。
  # 确认导入实际来自已装包，防止仓库模块掩盖分发缺件。
  build:
    name: Distribution and isolated wheel CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --outdir "$SAR_CI_RUN_ROOT/dist"
      # 2026-11-17: 移除 "Verify final documented assets in sdist" step。
      # 原因：它校验 docs/readme/data/source_bound_assets_manifest.json，
      # 而该文件已在 d3d4c85（"移除 9-10 月历史产物"）中删除，
      # 但本 step 未同步移除 -> 该门禁必然失败。
      # 若日后恢复"发布完整性校验"，应先在受控位置重建该清单再恢复此步。
      - name: Install wheel in a separate environment
        run: |
          python -m venv "$SAR_CI_RUN_ROOT/wheel-env"
          "$SAR_CI_RUN_ROOT/wheel-env/bin/python" -m pip install "$SAR_CI_RUN_ROOT"/dist/*.whl
      - name: Verify actual installed wheel outside checkout
        working-directory: /tmp
        run: |
          "$SAR_CI_RUN_ROOT/wheel-env/bin/adi-validate-config" --help
          "$SAR_CI_RUN_ROOT/wheel-env/bin/adi-simulate" --samples 32 \
            --output "$SAR_CI_RUN_ROOT/wheel-run"
          "$SAR_CI_RUN_ROOT/wheel-env/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path
          import adi_model
          root = Path(os.environ["SAR_CI_RUN_ROOT"])
          assert root / "wheel-env" in Path(adi_model.__file__).parents
          metadata = json.loads((root / "wheel-run/metadata.json").read_text(encoding="utf-8"))
          assert metadata["model_run"] is True
          assert metadata["result_role"] == "DIGITAL_IP_TRANSACTION_REFERENCE"
          assert metadata["source_reproduction"] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributions-and-wheel-contract
          path: |
            ${{ env.SAR_CI_RUN_ROOT }}/dist
            ${{ env.SAR_CI_RUN_ROOT }}/wheel-run
