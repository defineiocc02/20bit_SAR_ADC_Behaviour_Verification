[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["task1/tests"]
pythonpath = [".", "src"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--durations=15"]
filterwarnings = ["error::RuntimeWarning", "ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tools"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "D"]
# 中文注释保留全角标点，变量名可沿用电路公式的物理符号。
ignore = [
    "D203", "D213", "D413", "E501", "SIM108",
    "RUF001", "RUF002", "RUF003", "D400", "D415",
    "N802", "N803", "N806", "N815", "N816",
]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["D100", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["adi_model"]

[tool.ruff.format]
quote-style = "double"
