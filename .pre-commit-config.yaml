repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(docs/evidence/(.*\.(csv|pass|log|rpt)|20260930/vivado_complete_p7/.*|20260930/ci_workflow_f028/(workflow|jobs)_metadata\.json|20260930/reducer_scheduler/cxx_observation\.patch|20260930/arithmetic_runner_ci/generated_settle_excerpt\.txt)|tests/fixtures/vivado_2018_3_buffered/(check_timing|timing_summary)\.rpt)$
      - id: end-of-file-fixer
        exclude: ^(docs/evidence/(.*\.(csv|pass|log|rpt)|20260930/vivado_complete_p7/.*|20260930/ci_workflow_f028/(workflow|jobs)_metadata\.json|20260930/reducer_scheduler/cxx_observation\.patch|20260930/arithmetic_runner_ci/generated_settle_excerpt\.txt)|tests/fixtures/vivado_2018_3_buffered/(check_timing|timing_summary)\.rpt)$
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        files: ^src/
        additional_dependencies: [numpy>=1.24]
        args: [--config-file=pyproject.toml]
