name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_NUM_THREADS: "1"
  MPLBACKEND: Agg
  SAR_CI_RUN_ROOT: /tmp/sar-ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  rtl:
    name: Digital component contracts (not device signoff)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERILATOR: verilator
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CI simulator and report actual versions
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator clang
          verilator --version
          clang++ --version
          python -m pip install -e . "pytest>=7.4"
          mkdir -p "$SAR_CI_RUN_ROOT"
      - name: Independent integer arithmetic with explicit format
        run: |
          python tools/audit_rtl_arithmetic.py \
            --format-json sim/fixtures/math_only/format.json \
            --negative-controls --out "$SAR_CI_RUN_ROOT/arithmetic"
      - name: Selected DSP protocol and numerical kernels
        run: |
          python tools/run_open_rtl.py --simulator verilator \
            --tops result_fifo_tb spi_slave_tb cnv_ctrl_contract_tb \
              sys_error_corr_contract_tb sinc5_decim_tb \
            --out "$SAR_CI_RUN_ROOT/dsp-leaf"
      - name: Generate explicit synthetic source-control inputs
        run: |
          python tools/export_rtl_params.py \
            --config sim/fixtures/source_control_component/config.json \
            --format sim/fixtures/source_control_component/format.json \
            --binding sim/fixtures/source_control_component/binding.json \
            --out "$SAR_CI_RUN_ROOT/rtl-inputs"
      - name: Source-control digital component and CAAZ tags
        # 2+1 units / 6-bit backend are declared numerical fixtures.
        # Tag/pair checks do not certify analog AZ storage or original chip maps.
        run: |
          python tools/run_open_rtl.py --simulator verilator \
            --tops source_control_contract_tb source_control_caaz_tb \
            --inputs-dir "$SAR_CI_RUN_ROOT/rtl-inputs" \
            --weights sim/fixtures/source_control_component/weights.hex \
            --scalars sim/fixtures/source_control_component/scalars.hex \
            --frames 32 --out "$SAR_CI_RUN_ROOT/source-component"
      - name: Independently check captured masks and integer words
        run: |
          python tools/check_source_control_trace.py \
            --inputs-dir "$SAR_CI_RUN_ROOT/rtl-inputs" \
            --registers sim/fixtures/source_control_component/registers.json \
            --trace-dir "$SAR_CI_RUN_ROOT/source-component/source_control_contract_tb" \
            --caaz 0 --out "$SAR_CI_RUN_ROOT/source-check-base"
          python tools/check_source_control_trace.py \
            --inputs-dir "$SAR_CI_RUN_ROOT/rtl-inputs" \
            --registers sim/fixtures/source_control_component/registers.json \
            --trace-dir "$SAR_CI_RUN_ROOT/source-component/source_control_caaz_tb" \
            --caaz 1 --out "$SAR_CI_RUN_ROOT/source-check-caaz"
      - name: Fig19 static component and public replay (NO_TRAINING)
        # Explicitly select the slow module: one real 64-word/two-node capture,
        # same-plant Python replay, damaged-trace rejection and output protection.
        # Learning/holdout and DUT early-prefix negatives are separate evidence.
        run: |
          python -m pytest tests/integration/test_source_bound_replay.py -m slow -q \
            --basetemp "$SAR_CI_RUN_ROOT/source-replay-tmp" \
            -o cache_dir="$SAR_CI_RUN_ROOT/source-replay-cache" \
            --junitxml "$SAR_CI_RUN_ROOT/source-replay.xml"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digital-component-evidence
          path: ${{ env.SAR_CI_RUN_ROOT }}

  lint:
    name: Lint and formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.6.9
      - run: ruff check --output-format=github .
      - run: ruff format --check --diff .

  type:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .[dev]
      - run: mypy --config-file=pyproject.toml

  source_index:
    name: Source references and unresolved obligations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Check index structure without relabeling unbuilt mechanisms
        run: |
          mkdir -p "$SAR_CI_RUN_ROOT"
          set +e
          python -m adi_model.inventory_gate \
            --repo-root . --summary "$SAR_CI_RUN_ROOT/source-index.json"
          source_index_status=$?
          set -e
          python - "$source_index_status" "$SAR_CI_RUN_ROOT/source-index.json" <<'PY'
          import json
          import sys
          status = int(sys.argv[1])
          with open(sys.argv[2], encoding="utf-8") as handle:
              summary = json.load(handle)
          assert status in (0, 2), (status, summary)
          assert summary["static_refs_pass"], summary
          assert summary["source_conformance"] == "SOURCE_CONFORMANCE_NOT_ASSESSED"
          failures = [record for record in summary["records"]
                      if record["scope"] == "REGISTERED_REQUIRED_STATE"
                      and record["level"] == "FAIL"]
          assert not failures, failures
          print("Static references valid; source conformance remains NOT_ASSESSED.")
          unresolved = summary["unresolved_required_states"]
          print("Required-state completion:", summary["required_states_ready"])
          for record in unresolved:
              print(f"UNRESOLVED {record['level']} {record['check']}: {record['detail']}")
          for record in summary["records"]:
              if record["scope"] == "STATIC_IDENTITY_AND_REFERENCE" and record["level"] == "BLOCKED":
                  print(f"SOURCE_UNAVAILABLE {record['check']}: {record['detail']}")
          print("Static input completeness:", summary["static_inputs_complete"])
          if status == 2:
              print("Exit2 preserved as unresolved states above; this job is not an implementation PASS.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-index-states
          path: ${{ env.SAR_CI_RUN_ROOT }}/source-index.json

  test:
    name: Model contracts (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e .[dev]
      - name: Current unit and integration contracts
        run: pytest -m "not slow" -q --cov --cov-report=xml
      - name: Actual default and explicit-override CLI runs
        run: |
          mkdir -p "$SAR_CI_RUN_ROOT"
          adi-simulate --samples 64 --output "$SAR_CI_RUN_ROOT/default"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["SAR_CI_RUN_ROOT"])
          (root / "parameters.json").write_text(json.dumps({
              "unit_mismatch_std": 0.0, "bridge_mismatch_std": 0.0,
              "ra_noise_rms_v": 0.0008,
          }), encoding="utf-8")
          PY
          adi-simulate --samples 32 --parameters "$SAR_CI_RUN_ROOT/parameters.json" \
            --amplitude 3.5 --output "$SAR_CI_RUN_ROOT/explicit"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import numpy as np
          root = Path(os.environ["SAR_CI_RUN_ROOT"])
          for name, count in (("default", 64), ("explicit", 32)):
              with (root / name / "metadata.json").open(encoding="utf-8") as handle:
                  metadata = json.load(handle)
              assert metadata["model_run"] is True
              assert metadata["result_role"] == "UNCALIBRATED_NOMINAL_20BIT"
              assert metadata["source_reproduction"] is False
              assert metadata["source_conformance"] == "NOT_ASSESSED"
              assert metadata["records_filtered"] == 0
              assert metadata["inferences"] and metadata["unmodeled"]
              with np.load(root / name / "codes.npz", allow_pickle=False) as data:
                  assert all(len(data[key]) == count for key in data.files)
                  if name == "explicit":
                      assert data["analog_overflow"].any()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-contracts-py${{ matrix.python-version }}
          path: |
            coverage.xml
            ${{ env.SAR_CI_RUN_ROOT }}

  reproducibility:
    name: Seeded records and flags reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Run the actual model twice and compare records
        run: |
          mkdir -p "$SAR_CI_RUN_ROOT"
          adi-simulate --samples 128 --seed 20261105 --output "$SAR_CI_RUN_ROOT/run1"
          adi-simulate --samples 128 --seed 20261105 --output "$SAR_CI_RUN_ROOT/run2"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import numpy as np
          root = Path(os.environ["SAR_CI_RUN_ROOT"])
          with np.load(root / "run1/codes.npz", allow_pickle=False) as left, np.load(
              root / "run2/codes.npz", allow_pickle=False
          ) as right:
              assert left.files == right.files
              for key in left.files:
                  assert np.array_equal(left[key], right[key]), key
          left = json.loads((root / "run1/metadata.json").read_text(encoding="utf-8"))
          right = json.loads((root / "run2/metadata.json").read_text(encoding="utf-8"))
          assert left == right
          assert left["source_reproduction"] is False
          print("Seeded records, flags and assumption metadata match within this environment.")
          PY

  build:
    name: Distribution and isolated wheel CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --outdir "$SAR_CI_RUN_ROOT/dist"
      - name: Verify final documented assets in sdist
        run: |
          python - "$SAR_CI_RUN_ROOT/dist" <<'PY'
          """Exact source/manifest/sdist bytes check used by the CI build step."""

          import hashlib
          import json
          import re
          import sys
          import tarfile
          from pathlib import Path, PurePosixPath

          repo = Path.cwd().resolve()
          index_path = "docs/readme/data/source_bound_assets_manifest.json"
          assert (repo / index_path).stat().st_size <= 300 * 1024**2
          index_bytes = (repo / index_path).read_bytes()
          index = json.loads(index_bytes)
          assert index.get("schema_version") == 1 and type(index["schema_version"]) is int
          assets = index.get("assets")
          assert isinstance(assets, list) and assets, "final source-bound asset list is empty"
          expected = {index_path: {"sha256": hashlib.sha256(index_bytes).hexdigest(), "bytes": len(index_bytes)}}
          for item in assets:
              relative = item["path"]
              assert isinstance(relative, str) and "\\" not in relative
              path = PurePosixPath(relative)
              assert not path.is_absolute() and ".." not in path.parts
              assert path.as_posix() == relative
              assert relative not in expected, f"duplicate/self-indexed asset: {relative}"
              target = (repo / relative).resolve()
              assert repo in target.parents and target.is_file(), relative
              size = item["bytes"]
              assert type(size) is int and 0 < size <= 300 * 1024**2, relative
              assert target.stat().st_size == size, relative
              assert isinstance(item["sha256"], str) and re.fullmatch("[0-9a-f]{64}", item["sha256"])
              assert hashlib.sha256(target.read_bytes()).hexdigest() == item["sha256"], relative
              expected[relative] = item

          archives = list(Path(sys.argv[1]).glob("*.tar.gz"))
          assert len(archives) == 1 and archives[0].stat().st_size <= 300 * 1024**2
          with tarfile.open(archives[0]) as archive:
              members = {}
              for member in archive.getmembers():
                  parts = PurePosixPath(member.name).parts
                  if len(parts) < 2:
                      continue
                  relative = PurePosixPath(*parts[1:]).as_posix()
                  assert relative not in members, f"duplicate archive member: {relative}"
                  members[relative] = member
              for relative, item in expected.items():
                  assert relative in members, f"missing source-bound asset in sdist: {relative}"
                  member = members[relative]
                  assert member.isfile() and member.size == item["bytes"], relative
                  stream = archive.extractfile(member)
                  assert stream is not None
                  assert hashlib.sha256(stream.read()).hexdigest() == item["sha256"], relative
              references = json.loads((repo / "references/source_manifest.json").read_text())
              originals = [item["target_relative_path"] for item in references["documents"]]
              assert originals and all(relative not in members for relative in originals)
              assert not any(relative.lower().endswith(".pdf") for relative in members)
          print(f"Verified {len(assets)} source-bound assets plus index; registered PDF originals excluded.")
          PY
      - name: Install wheel in a separate environment
        run: |
          python -m venv "$SAR_CI_RUN_ROOT/wheel-env"
          "$SAR_CI_RUN_ROOT/wheel-env/bin/python" -m pip install "$SAR_CI_RUN_ROOT"/dist/*.whl
      - name: Verify actual installed wheel outside checkout
        working-directory: /tmp
        run: |
          "$SAR_CI_RUN_ROOT/wheel-env/bin/adi-validate-config" --help
          "$SAR_CI_RUN_ROOT/wheel-env/bin/adi-simulate" --samples 32 \
            --output "$SAR_CI_RUN_ROOT/wheel-run"
          "$SAR_CI_RUN_ROOT/wheel-env/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path
          import adi_model
          root = Path(os.environ["SAR_CI_RUN_ROOT"])
          assert root / "wheel-env" in Path(adi_model.__file__).parents
          metadata = json.loads((root / "wheel-run/metadata.json").read_text(encoding="utf-8"))
          assert metadata["model_run"] is True
          assert metadata["result_role"] == "UNCALIBRATED_NOMINAL_20BIT"
          assert metadata["source_reproduction"] is False
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributions-and-wheel-contract
          path: |
            ${{ env.SAR_CI_RUN_ROOT }}/dist
            ${{ env.SAR_CI_RUN_ROOT }}/wheel-run
