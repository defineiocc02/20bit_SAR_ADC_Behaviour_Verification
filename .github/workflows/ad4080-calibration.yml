# =============================================================================
# 文件名     : ad4080-calibration.yml
# 模块名     : 独立外围的板级校准回归
# 版本       : v1.0
# 功能       : 用固定 ADCToolbox 源码和仓内原 DSP，验证主机估算及定点寄存器计划。
# 设计说明   : 校准源码、产品读回路径或实际修正模块变化时复测。使用开源工具。
# 变更记录   : 主机估计、逐码核对与 SPI 写入到存储读回在同一作业中运行。
# =============================================================================
name: AD4080 system calibration
on:
  pull_request:
    paths:
      - 'subsys/ad4080_peripherals/calibration/**'
      - 'subsys/ad4080_peripherals/integration/**'
      - 'subsys/ad4080_peripherals/**/*.sv'
      - 'subsys/ad4080_peripherals/evidence/MANUAL_TRACE.md'
      - 'subsys/ad4080_peripherals/report/manual-trace.*'
      - 'subsys/ad4080_peripherals/verify/check_manual_trace.mjs'
      - 'subsys/ad4080_dsp/rtl/**'
      - 'subsys/ad4080_dsp/model/ad4080_cal_model.py'
      - '.github/workflows/ad4080-calibration.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: ad4080-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calibration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      CAL: subsys/ad4080_peripherals/calibration
    steps:
      - uses: actions/checkout@v4
        with:
          # 硬件算术参考按提交读 Git 对象，浅克隆可能只有 PR merge 对象。
          fetch-depth: 0
      - name: Check each module against the manual evidence inventory
        shell: bash
        run: |
          p=subsys/ad4080_peripherals
          node "$p/verify/check_manual_trace.mjs" --check-local
          # 可打印稿由同一份 Markdown 生成。干净检出也要核对这次发布的内容。
          digest=$(sha256sum "$p/evidence/MANUAL_TRACE.md" | cut -d' ' -f1)
          grep -Fxq "% Markdown SHA-256 $digest" "$p/report/manual-trace.tex"
          python3 "$p/verify/check_delivery.py"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned host estimator
        run: python -m pip install --retries 3 -r "$CAL/requirements.txt"
      - name: Exercise the estimators, measured table and offset trim
        run: python -m unittest discover -s "$CAL" -p 'test_*.py' -v
      - name: Prepare open-source simulator
        shell: bash
        run: |
          if ! command -v verilator >/dev/null; then
            source /etc/os-release
            arch="$(dpkg --print-architecture)"
            list="$RUNNER_TEMP/ad4080-calibration-ubuntu.list"
            options=(-o "Dir::Etc::sourcelist=$list" -o Dir::Etc::sourceparts=-
                     -o Acquire::Languages=none -o Acquire::Retries=2 -o Acquire::https::Timeout=15)
            for mirror in https://azure.archive.ubuntu.com/ubuntu https://mirrors.edge.kernel.org/ubuntu; do
              for suite in "$VERSION_CODENAME" "$VERSION_CODENAME-updates" "$VERSION_CODENAME-security"; do
                printf 'deb [arch=%s signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] %s %s main universe\n' "$arch" "$mirror" "$suite"
              done > "$list"
              if sudo apt-get "${options[@]}" -o APT::Update::Error-Mode=any update &&
                 sudo apt-get "${options[@]}" install -y --no-install-recommends verilator; then break; fi
            done
          fi
          verilator --version
          clang++ --version
      - name: Compare held-out samples with the existing DSP RTL
        run: python "$CAL/verify_rtl.py" --repo . --out "$RUNNER_TEMP/ad4080-system-calibration.json"
      - name: Publish the independent Figure 96 result
        shell: bash
        run: |
          # 工程回归和手册符合性有独立判据，摘要给出两个码值以便复核。
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "ad4080-system-calibration.json").read_text())
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
              print("### AD4080 Rev. B 图 96 运算顺序", file=summary)
              print("", file=summary)
              print("```json", file=summary)
              print(json.dumps(result["manual_order_check"], ensure_ascii=False, indent=2), file=summary)
              print("```", file=summary)
          PY
      - name: Write the estimated coefficients through SPI and read both records
        shell: bash
        run: |
          # 输入是主机实算的寄存器字节，断言比较从同一四银行存储读出的完整记录。
          export DSP_UPSTREAM_REPO="$GITHUB_WORKSPACE"
          export CAL_PYTHON="$(command -v python)"
          bash subsys/ad4080_peripherals/integration/product/run_product.sh --calibration |
            tee "$RUNNER_TEMP/ad4080-calibrated-record.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: ad4080-system-calibration
          path: |
            ${{ runner.temp }}/ad4080-system-calibration.json
            ${{ runner.temp }}/ad4080-calibrated-record.txt
