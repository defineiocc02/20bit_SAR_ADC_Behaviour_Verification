name: 20b10mtask DRC of the frozen LMS GDS

on:
  push:
    branches: [20b10mtask]
    paths:
      - '.github/workflows/task2_drc_artifact.yml'
      - 'task2/physical/drc_artifact/**'
  workflow_dispatch:
    inputs:
      physical_run_id:
        description: 'Workflow run containing the frozen LMS GDS'
        required: true
        type: string
      artifact_name:
        description: 'Exact artifact name in the physical run'
        required: true
        type: string
      rtl_commit:
        description: 'Expected source commit (40 hex digits)'
        required: true
        type: string
      gds_sha256:
        description: 'Expected GDS SHA-256 (64 hex digits)'
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  check_drc:
    if: github.ref_name == '20b10mtask'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      INPUT_DIR: /tmp/task2-drc-artifact-input-${{ github.run_id }}-${{ github.run_attempt }}
      OUTPUT_DIR: /tmp/task2-drc-artifact-result-${{ github.run_id }}-${{ github.run_attempt }}
      DRC_SOURCE_RUN: ${{ inputs.physical_run_id }}
      DRC_EXPECTED_COMMIT: ${{ inputs.rtl_commit }}
      DRC_EXPECTED_GDS: ${{ inputs.gds_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate the DRC entry point
        run: bash -n task2/physical/drc_artifact/check.sh
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          run-id: ${{ inputs.physical_run_id }}
          name: ${{ inputs.artifact_name }}
          github-token: ${{ github.token }}
          path: ${{ env.INPUT_DIR }}
      - name: Run the original public DRC deck on the frozen GDS
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 40
        run: bash task2/physical/drc_artifact/check.sh "$INPUT_DIR" "$OUTPUT_DIR"
      - name: Upload DRC report, exit status and SHA-256 evidence
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: task2-drc-artifact-${{ github.run_id }}
          path: ${{ env.OUTPUT_DIR }}
          if-no-files-found: warn
