<text x="803.5" y="345.5" text-anchor="middle" font-size="16" font-weight="400" fill="#425b66">u_adc2</text>
<rect x="359" y="425" width="225" height="70" rx="3" fill="#ffffff" stroke="#1b3441" stroke-width="1.8"/>
<text x="471.5" y="457.0" text-anchor="middle" font-size="22" font-weight="600" fill="#1b3441">按物理开关求权重</text>
<text x="471.5" y="481.0" text-anchor="middle" font-size="16" font-weight="400" fill="#425b66">u_wsum</text>
<rect x="702" y="425" width="203" height="70" rx="3" fill="#eef6f5" stroke="#006d6a" stroke-width="1.8"/>
<text x="803.5" y="457.0" text-anchor="middle" font-size="22" font-weight="600" fill="#006d6a">20 位定点重构</text>
<text x="803.5" y="481.0" text-anchor="middle" font-size="16" font-weight="400" fill="#425b66">u_recon</text>
<path d="M268 323 H359" fill="none" stroke="#1b3441" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#digital-transaction-flow-i)"/>
<text x="313" y="309" text-anchor="middle" font-size="16" font-weight="400" fill="#425b66">qid, U</text>
<path d="M164 363 V459 H359" fill="none" stroke="#1b3441" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#digital-transaction-flow-i)"/>
<text x="177" y="445" text-anchor="start" font-size="16" font-weight="400" fill="#425b66">片号、采样开关 pre</text>
<path d="M476 363 V425" fill="none" stroke="#1b3441" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#digital-transaction-flow-i)"/>
<text x="487" y="399" text-anchor="start" font-size="16" font-weight="400" fill="#425b66">最终 post</text>
<path d="M584 461 H646 V326 H702" fill="none" stroke="#1b3441" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#digital-transaction-flow-i)"/>
<text x="634" y="479" text-anchor="middle" font-size="16" font-weight="400" fill="#425b66">G, Wm, Wp</text>
<path d="M797 363 V425" fill="none" stroke="#1b3441" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#digital-transaction-flow-i)"/>
<text x="807" y="399" text-anchor="start" font-size="16" font-weight="400" fill="#425b66">raw、权重、tag</text>
<path d="M803 495 V554" fill="none" stroke="#006d6a" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#digital-transaction-flow-t)"/>
<text x="752" y="580" text-anchor="middle" font-size="16" font-weight="550" fill="#006d6a" font-family="Menlo, DejaVu Sans Mono, monospace">out_valid · out_code[19:0] · out_tag</text>
<text x="35" y="568" text-anchor="start" font-size="17" font-weight="400" fill="#425b66">pre 为采样开关，post 为最后实际写入的转换开关。</text>
</g>
</g>
</svg>
