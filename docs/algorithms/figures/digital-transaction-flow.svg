<text x="542" y="218" text-anchor="start" font-size="16" font-weight="400" fill="#006d6a" font-family="Menlo, DejaVu Sans Mono, monospace">rdac_post_state_o</text>
<path d="M744 286 V165" fill="none" stroke="#425b66" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#digital-transaction-flow-g)"/>
<text x="737" y="192" text-anchor="end" font-size="16" font-weight="400" fill="#425b66" font-family="Menlo, DejaVu Sans Mono, monospace">adc2_capture_arm_o</text>
<path d="M885 165 V286" fill="none" stroke="#1b3441" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#digital-transaction-flow-i)"/>
<text x="879" y="220" text-anchor="end" font-size="16" font-weight="400" fill="#1b3441" font-family="Menlo, DejaVu Sans Mono, monospace">adc2_raw_i</text>
</g>
<g id="digital-transaction-flow-dataflow">
<rect x="55" y="286" width="213" height="77" rx="3" fill="#ffffff" stroke="#1b3441" stroke-width="1.8"/>
<text x="161.5" y="321.5" text-anchor="middle" font-size="22" font-weight="600" fill="#1b3441">片选与采样预置</text>
<text x="161.5" y="345.5" text-anchor="middle" font-size="16" font-weight="400" fill="#425b66">u_sched · u_ctx · u_pd</text>
<rect x="359" y="286" width="225" height="77" rx="3" fill="#ffffff" stroke="#1b3441" stroke-width="1.8"/>
<text x="471.5" y="321.5" text-anchor="middle" font-size="22" font-weight="600" fill="#1b3441">已决位与 DEM</text>
<text x="471.5" y="345.5" text-anchor="middle" font-size="16" font-weight="400" fill="#425b66">u_evt · u_dem</text>
<rect x="702" y="286" width="203" height="77" rx="3" fill="#ffffff" stroke="#1b3441" stroke-width="1.8"/>
